[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irnxsec-pro"
version = "2.0.0"
description = "IRNXSEC Pro - authorized web & network assessment toolkit with localhost dashboard and signed engagement certificates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "IRNXSEC" }]
keywords = ["security", "pentest", "assessment", "web", "network", "dns", "localhost"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "requests>=2.31,<3.0",
  "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]
dns = ["dnspython>=2.6"]
certs = ["cryptography>=42"]
full = ["reportlab>=4.0", "dnspython>=2.6", "cryptography>=42"]
dev = ["pytest>=8.0", "reportlab>=4.0", "dnspython>=2.6", "cryptography>=42", "httpx>=0.27"]

[project.scripts]
irnxsec = "irnxsec.cli:main"

[project.urls]
Homepage = "https://github.com/winrx20/irnxX-tools"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["irnxsec*"]

[tool.setuptools.package-data]
irnxsec = ["webui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
